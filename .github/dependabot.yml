version: 2
updates:
  # Ruby dependencies (Bundler) - PATCH ONLY, SINGLE PR
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"

    # Group ALL updates into ONE PR (patch updates only)
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"

    # Ignore EVERYTHING except patch updates
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]

    open-pull-requests-limit: 1

  # NPM/Yarn dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Los_Angeles"
    # Group ALL npm updates into a single PR
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # Auto-merge patch and minor updates (not major)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
