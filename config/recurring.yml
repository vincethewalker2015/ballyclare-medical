# Recurring background jobs managed by Solid Queue.

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  cleanup_expired_guest_bookings:
    class: CleanupExpiredGuestBookingsJob
    schedule: every 15 minutes

  recover_paid_guest_bookings:
    class: RecoverPaidGuestBookingsJob
    schedule: every 5 minutes

  recover_pending_refunds:
    class: RecoverPendingRefundsJob
    schedule: every 5 minutes

  reconcile_processing_refunds:
    class: ReconcileProcessingRefundsJob
    schedule: every 5 minutes

  reconcile_processing_appointment_payments:
    class: ReconcileProcessingAppointmentPaymentsJob
    schedule: every 5 minutes
