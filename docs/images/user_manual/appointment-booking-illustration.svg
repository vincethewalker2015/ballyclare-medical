<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">Staff appointment booking form</title><desc id="desc">Simplified staff booking form showing patient selection, clinician, appointment date, available time, optional reason, automatically applied consultation fee and Book appointment button. Example entries are fictional.</desc>
<rect width="1100" height="610" rx="20" fill="#f6f9fb"/><rect x="24" y="22" width="1052" height="565" rx="18" fill="#fff" stroke="#d6e2e8" stroke-width="2"/>
<text x="58" y="74" font-family="Arial,sans-serif" font-size="33" font-weight="bold" fill="#123c58">Book appointment</text>
<text x="58" y="105" font-family="Arial,sans-serif" font-size="17" fill="#617785">Book an appointment on behalf of a patient.</text>
<rect x="58" y="131" width="984" height="402" rx="14" fill="#fff" stroke="#d6e2e8"/>
<g font-family="Arial,sans-serif" fill="#123c58" font-size="17" font-weight="bold"><text x="84" y="174">Patient</text><text x="570" y="174">Clinician</text><text x="84" y="269">Appointment date</text><text x="570" y="269">Available appointment</text><text x="84" y="365">Reason for appointment</text><text x="570" y="365">Consultation fee</text></g>
<g stroke="#cbdde5" fill="#f9fbfc"><rect x="84" y="187" width="440" height="48" rx="10"/><rect x="570" y="187" width="440" height="48" rx="10"/><rect x="84" y="282" width="440" height="48" rx="10"/><rect x="570" y="282" width="440" height="48" rx="10"/><rect x="84" y="378" width="440" height="66" rx="10"/><rect x="570" y="378" width="440" height="66" rx="10"/></g>
<g font-family="Arial,sans-serif" fill="#617785" font-size="17"><text x="101" y="217">Select patient</text><text x="587" y="217">Select a clinician</text><text x="101" y="312">Choose date</text><text x="101" y="408">Optional brief reason</text><text x="587" y="408">Applied automatically for the clinician</text></g>
<circle cx="591" cy="306" r="9" fill="#147d91"/><circle cx="591" cy="306" r="4" fill="#fff"/><text x="611" y="312" font-family="Arial,sans-serif" fill="#123c58" font-size="17">Select available time</text>
<rect x="796" y="467" width="214" height="48" rx="12" fill="#123c58"/><text x="903" y="497" font-family="Arial,sans-serif" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">Book appointment</text>
<text x="58" y="563" font-family="Arial,sans-serif" font-size="16" fill="#617785">Staff booking can leave an outstanding balance; payment is optional at booking.</text>
<text x="58" y="583" font-family="Arial,sans-serif" font-size="13" fill="#617785">Illustration — simplified interface; no patient data</text></svg>