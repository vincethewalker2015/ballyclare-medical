<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">Clinician availability form</title><desc id="desc">Simplified Add availability screen with clinician, date, start time, end time, appointment duration, and Allow online booking checkbox. All entries are examples.</desc><rect width="1100" height="690" rx="20" fill="#f6f9fb"/><rect x="24" y="22" width="1052" height="646" rx="18" fill="#fff" stroke="#d6e2e8" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="58" y="76" fill="#123c58" font-size="34" font-weight="bold">Add availability</text><text x="58" y="108" fill="#617785" font-size="17">Add a clinician's working period and generate bookable appointment slots.</text><rect x="58" y="130" width="984" height="486" rx="14" fill="#f9fbfc" stroke="#d6e2e8"/><g><text x="78" y="168" fill="#123c58" font-size="18" font-weight="bold">Clinician</text><rect x="78" y="181" width="445" height="52" rx="10" fill="#fff" stroke="#cbdde5" stroke-width="2"/><text x="96" y="214" fill="#526c7a" font-size="17">Select clinician</text><path d="M489 201 l7 7 7 -7" fill="none" stroke="#617785" stroke-width="2"/><text x="573" y="168" fill="#123c58" font-size="18" font-weight="bold">Date</text><rect x="573" y="181" width="445" height="52" rx="10" fill="#fff" stroke="#cbdde5" stroke-width="2"/><text x="591" y="214" fill="#526c7a" font-size="17">Choose date</text><path d="M984 201 l7 7 7 -7" fill="none" stroke="#617785" stroke-width="2"/><text x="78" y="268" fill="#123c58" font-size="18" font-weight="bold">Start time</text><rect x="78" y="281" width="445" height="52" rx="10" fill="#fff" stroke="#cbdde5" stroke-width="2"/><text x="96" y="314" fill="#526c7a" font-size="17">Select start time</text><path d="M489 301 l7 7 7 -7" fill="none" stroke="#617785" stroke-width="2"/><text x="573" y="268" fill="#123c58" font-size="18" font-weight="bold">End time</text><rect x="573" y="281" width="445" height="52" rx="10" fill="#fff" stroke="#cbdde5" stroke-width="2"/><text x="591" y="314" fill="#526c7a" font-size="17">Select end time</text><path d="M984 301 l7 7 7 -7" fill="none" stroke="#617785" stroke-width="2"/><text x="78" y="368" fill="#123c58" font-size="18" font-weight="bold">Appointment duration</text><rect x="78" y="381" width="445" height="52" rx="10" fill="#fff" stroke="#cbdde5" stroke-width="2"/><text x="96" y="414" fill="#526c7a" font-size="17">20 minutes</text><path d="M489 401 l7 7 7 -7" fill="none" stroke="#617785" stroke-width="2"/></g><rect x="573" y="381" width="445" height="82" rx="10" fill="#edf3f4" stroke="#d6e2e8"/><rect x="592" y="399" width="22" height="22" rx="4" fill="#fff" stroke="#147d91" stroke-width="2"/><path d="M597 409 l5 5 9 -11" fill="none" stroke="#147d91" stroke-width="2.5"/><text x="629" y="415" fill="#123c58" font-size="18" font-weight="bold">Allow online booking</text><text x="629" y="441" fill="#617785" font-size="15">Patients can book generated slots</text><text x="78" y="505" fill="#617785" font-size="16">Choose the working period and duration before saving.</text><rect x="792" y="541" width="226" height="51" rx="11" fill="#123c58"/><text x="905" y="573" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Add availability</text><text x="58" y="647" fill="#617785" font-size="14">Illustration — simplified interface; no patient data</text></g></svg>