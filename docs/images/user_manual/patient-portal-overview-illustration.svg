<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Patient portal appointments and payments</title><desc id="desc">Simplified patient portal dashboard illustrating Find an appointment, View your appointments, Payment history and receipts, and View balances. No patient details or real balances.</desc><rect width="1100" height="530" rx="20" fill="#f6f9fb"/><rect x="24" y="22" width="1052" height="486" rx="18" fill="#fff" stroke="#d6e2e8" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="58" y="76" fill="#123c58" font-size="34" font-weight="bold">Patient portal</text><text x="58" y="107" fill="#617785" font-size="18">Your appointments and balances in one place.</text><rect x="58" y="144" width="470" height="118" rx="15" fill="#e7f4f5" stroke="#d6e2e8" stroke-width="2"/><circle cx="93" cy="183" r="20" fill="#d3e8ef"/><text x="93" y="190" text-anchor="middle" fill="#123c58" font-size="21" font-weight="bold">1</text><text x="127" y="186" fill="#123c58" font-size="21" font-weight="bold">Find an appointment</text><text x="83" y="228" fill="#617785" font-size="16">Choose a clinician and available time</text><rect x="554" y="144" width="470" height="118" rx="15" fill="#fff" stroke="#d6e2e8" stroke-width="2"/><circle cx="589" cy="183" r="20" fill="#d3e8ef"/><text x="589" y="190" text-anchor="middle" fill="#123c58" font-size="21" font-weight="bold">2</text><text x="623" y="186" fill="#123c58" font-size="21" font-weight="bold">View your appointments</text><text x="579" y="228" fill="#617785" font-size="16">See upcoming and previous appointments</text><rect x="58" y="282" width="470" height="118" rx="15" fill="#fff" stroke="#d6e2e8" stroke-width="2"/><circle cx="93" cy="321" r="20" fill="#d3e8ef"/><text x="93" y="328" text-anchor="middle" fill="#123c58" font-size="21" font-weight="bold">3</text><text x="127" y="324" fill="#123c58" font-size="21" font-weight="bold">Payment history and receipts</text><text x="83" y="366" fill="#617785" font-size="16">Review payments, refunds and receipts</text><rect x="554" y="282" width="470" height="118" rx="15" fill="#fff" stroke="#d6e2e8" stroke-width="2"/><circle cx="589" cy="321" r="20" fill="#d3e8ef"/><text x="589" y="328" text-anchor="middle" fill="#123c58" font-size="21" font-weight="bold">4</text><text x="623" y="324" fill="#123c58" font-size="21" font-weight="bold">View balances</text><text x="579" y="366" fill="#617785" font-size="16">See your outstanding account balance</text><text x="58" y="445" fill="#617785" font-size="16">Booking holds are temporary; payment and confirmation must complete.</text><text x="58" y="484" fill="#617785" font-size="13">Illustration — simplified interface; no patient or payment data</text></g></svg>