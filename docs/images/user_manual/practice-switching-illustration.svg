<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
<title id="title">Switching between practices</title><desc id="desc">A simplified three-step illustration: choose a practice in your medical group, switch, then see the selected practice's appointment diary. Practice data remains separate.</desc>
<rect width="1100" height="470" rx="20" fill="#f6f9fb"/><rect x="24" y="22" width="1052" height="426" rx="18" fill="#fff" stroke="#d6e2e8" stroke-width="2"/>
<text x="58" y="78" font-family="Arial,sans-serif" font-size="33" font-weight="bold" fill="#123c58">Working across multiple practices</text>
<text x="58" y="111" font-family="Arial,sans-serif" font-size="17" fill="#617785">Choose an authorised practice to work with its appointments and patients.</text>
<rect x="58" y="148" width="310" height="216" rx="14" fill="#f3f8fa" stroke="#d6e2e8"/><circle cx="88" cy="181" r="17" fill="#cce6f4"/><text x="88" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#123c58" font-weight="bold">1</text>
<text x="117" y="188" font-family="Arial,sans-serif" font-size="20" fill="#123c58" font-weight="bold">Select a practice</text>
<rect x="80" y="217" width="266" height="45" rx="8" fill="#fff" stroke="#cbdde5"/><circle cx="101" cy="240" r="8" fill="#147d91"/><circle cx="101" cy="240" r="3" fill="#fff"/><text x="120" y="246" font-family="Arial,sans-serif" font-size="16" fill="#123c58">Practice A</text>
<rect x="80" y="271" width="266" height="45" rx="8" fill="#fff" stroke="#cbdde5"/><circle cx="101" cy="294" r="8" fill="#fff" stroke="#93aab6" stroke-width="2"/><text x="120" y="300" font-family="Arial,sans-serif" font-size="16" fill="#123c58">Practice B</text>
<text x="383" y="270" font-family="Arial,sans-serif" font-size="34" fill="#147d91">→</text>
<rect x="414" y="148" width="264" height="216" rx="14" fill="#f3f8fa" stroke="#d6e2e8"/><circle cx="445" cy="181" r="17" fill="#cce6f4"/><text x="445" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#123c58" font-weight="bold">2</text>
<text x="475" y="188" font-family="Arial,sans-serif" font-size="20" fill="#123c58" font-weight="bold">Switch</text>
<rect x="452" y="235" width="188" height="50" rx="25" fill="#123c58"/><text x="546" y="266" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Switch practice</text>
<text x="692" y="270" font-family="Arial,sans-serif" font-size="34" fill="#147d91">→</text>
<rect x="722" y="148" width="320" height="216" rx="14" fill="#f3f8fa" stroke="#d6e2e8"/><circle cx="753" cy="181" r="17" fill="#cce6f4"/><text x="753" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#123c58" font-weight="bold">3</text>
<text x="782" y="188" font-family="Arial,sans-serif" font-size="19" fill="#123c58" font-weight="bold">Selected practice diary</text>
<rect x="748" y="214" width="266" height="45" rx="9" fill="#fff" stroke="#cbdde5"/><text x="767" y="242" font-family="Arial,sans-serif" font-size="17" fill="#123c58" font-weight="bold">Practice A · Appointments</text>
<rect x="748" y="273" width="266" height="49" rx="9" fill="#e5f1f5"/><text x="767" y="293" font-family="Arial,sans-serif" font-size="15" fill="#123c58">Patients and appointments</text><text x="767" y="313" font-family="Arial,sans-serif" font-size="15" fill="#123c58">for selected practice only</text>
<text x="58" y="407" font-family="Arial,sans-serif" font-size="16" fill="#617785">You can switch only to authorised practices within your medical group. Records are not transferred.</text>
<text x="58" y="431" font-family="Arial,sans-serif" font-size="13" fill="#617785">Illustration — simplified workflow; not patient data</text></svg>